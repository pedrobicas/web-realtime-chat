name: Frontend CI

on:
  push:
    branches: [master, 'develop/**']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unresolved merge conflicts
        run: |
          if git grep -n -I -E '^(<<<<<<< |=======$|>>>>>>> )' -- .; then
            echo "Unresolved merge conflict markers found"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test (Chrome Headless)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless
